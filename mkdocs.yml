    - "Modulo 1: Tiempos y consignas": simulacros/modulo-1.md
    - "Modulo 2: Integracion final": simulacros/modulo-2.md
    - "Modulo 3: Simulacro de Lengua": simulacros/modulo-3.md
    - "Modulo 4: Simulacro de Matematica": simulacros/modulo-4.md
    - "Modulo 5: Simulacro de Ciencias": simulacros/modulo-5.md
  - Cierre: cierre.md
  - Claves y criterios:
    - Indice: claves/index.md
    - Matematica: claves/matematica.md
    - Lengua: claves/lengua.md
    - Ciencias Naturales: claves/ciencias-naturales.md
    - Ciencias Sociales: claves/sociales.md
